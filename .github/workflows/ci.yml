name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit & Stress Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install SQLite fixture dependency
        run: sudo apt-get update -qq && sudo apt-get install -y sqlite3
      - name: Run isolated Vitest suite
        run: npm test

  build-and-packaging:
    name: Build & Packaging Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build dist
        run: npm run build
      - name: Validate Desktop Entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/julesdeck.desktop
      - name: Test Installer Help
        run: ./packaging/install.sh --help

  headless-e2e:
    name: Headless Electron E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux GUI & Xvfb libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libatk-bridge2.0-0t64 libxss1 libdrm2 libxkbcommon0 libsecret-1-0 git
      - name: Install dependencies
        run: npm ci
      - name: Build dist
        run: npm run build
      - name: Run Headless Electron E2E with Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:e2e
